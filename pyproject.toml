[project]
name = "finage"
version = "0.1.0"
description = "Personal financial analyst MVP with WSB scraping and Telegram digests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpraw>=7.8.1",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
finage = "finage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
